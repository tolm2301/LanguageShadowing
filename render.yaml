services:
  - type: web
    name: shadowing-backend
    env: node
    plan: free
    buildCommand: pip install -U youtube-transcript-api --break-system-packages || pip3 install -U youtube-transcript-api --break-system-packages || true && npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
